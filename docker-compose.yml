version: '3.8'

services:
  facesentinel-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facesentinel-backend
    network_mode: "host"   # Permite conectar directamente a 127.0.0.1:5600 del Geth local en Debian
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - deepface_models:/root/.deepface

  facesentinel-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facesentinel-frontend
    network_mode: "host"   # Expone el puerto 8088 configurado en nginx.conf directamente en el host
    restart: always
    depends_on:
      - facesentinel-backend

volumes:
  deepface_models:
